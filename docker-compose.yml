services:
  postgres:
    image: postgres:15
    container_name: medibill_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medibill_db}
      POSTGRES_USER: ${POSTGRES_USER:-medibill_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medibill_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medibill_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medibill_user} -d ${POSTGRES_DB:-medibill_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medibill_user}:${POSTGRES_PASSWORD:-medibill_password}@postgres:5432/${POSTGRES_DB:-medibill_db}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-32-chars}
      APP_ENV: ${APP_ENV:-development}
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medibill_network
    command: alembic upgrade head
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medibill_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medibill_user}:${POSTGRES_PASSWORD:-medibill_password}@postgres:5432/${POSTGRES_DB:-medibill_db}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-32-chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      APP_ENV: ${APP_ENV:-development}
      GST_PROVIDER: ${GST_PROVIDER:-gstinapi}
      GSTINAPI_KEY: ${GSTINAPI_KEY:-}
      GSTINAPI_BASE_URL: ${GSTINAPI_BASE_URL:-https://www.gstinapi.in}
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - medibill_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medibill_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - medibill_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:

networks:
  medibill_network:
    driver: bridge
