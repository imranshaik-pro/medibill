services:

  db:
    image: postgres:16-alpine
    container_name: medibill-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medibill}
      POSTGRES_USER: ${POSTGRES_USER:-medibill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medibill_dev_password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medibill} -d ${POSTGRES_DB:-medibill}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: