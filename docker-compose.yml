version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: medibill_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medibill_db}
      POSTGRES_USER: ${POSTGRES_USER:-medibill_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medibill_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medibill_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medibill_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medibill_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medibill_user}:${POSTGRES_PASSWORD:-medibill_password}@postgres:5432/${POSTGRES_DB:-medibill_db}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-32-chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - medibill_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medibill_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - medibill_network
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  medibill_network:
    driver: bridge
