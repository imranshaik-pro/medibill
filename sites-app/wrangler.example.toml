name = "medibill-pro"
main = "dist/server/index.js"
compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "medibill-production"
database_id = "SET_AFTER_CREATING_D1_DATABASE"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "medibill-production-files"

[vars]
# Agency/distributor billing. Use retail only for patient-facing dispensing.
BILLING_MODE = "wholesale"
GEMINI_VISION_MODEL = "gemini-3.1-flash-lite"
