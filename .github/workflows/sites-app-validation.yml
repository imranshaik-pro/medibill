name: MediBill Sites App Financial Validation

on:
  pull_request:
    branches: [sites-v34-fullstack-sync]
    paths:
      - "sites-app/lib/financial-validation.ts"
      - "sites-app/tests/financial-validation.test.mjs"
      - "sites-app/package.json"
      - ".github/workflows/sites-app-validation.yml"
  workflow_dispatch:

jobs:
  financial-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Run sales financial validation tests
        run: npm run test:financial-validation
